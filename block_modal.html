<div class="modal-panel block-config-modal" role="dialog" aria-modal="true" aria-labelledby="{{ node_id }}BlockModalTitle" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="{{ node_kind }}">
  <div class="modal-header">
    <div>
      <span class="panel-kicker"><span data-i18n="ui.block_kit.block">Block</span> {{ node_kind_title }}</span>
      <h2 id="{{ node_id }}BlockModalTitle">{{ node_title }}</h2>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button>
    </div>
  </div>
  <div class="block-config-modal-body">
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.identity">Identity</span></div>
      {{ title_field_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="block.array_builder.conversion_label">Conversion</span></div>
      <div class="field-group">
        <label data-i18n="block.array_builder.mode_label">Conversion mode</label>
        <select data-block-config-field="mode">
          {{ mode_options }}
        </select>
      </div>
      <p class="inspector-copy" data-i18n="block.array_builder.mode_help">{{ mode_help }}</p>
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.ports">Ports</span></div>
      {{ ports_html }}
    </section>
    <section class="ports-editor-section">
      <div class="ports-editor-header"><span class="group-label" data-i18n="ui.block_kit.last_state">Last state</span></div>
      {{ runtime_html }}
    </section>
  </div>
</div>
